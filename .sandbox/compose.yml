name: network-orchestrator-sandbox

services:
  app:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
    command: sleep infinity
    # Internal network only: no route to the internet except through the proxy.
    networks: [sandbox]
    volumes:
      # Only the worktrees and .git are mounted, never the main checkout.
      # Worktrees use relative paths, so any shared parent dir works.
      - ../.worktrees:/workspace/.worktrees
      - ../.git:/workspace/.git
      # Hooks and config run commands on the host: read-only.
      - ../.git/hooks:/workspace/.git/hooks:ro
      - ../.git/config:/workspace/.git/config:ro
      - cargo-target:/home/dev/target
      - cargo-registry:/usr/local/cargo/registry
      - agent-home:/home/dev/.claude
    environment:
      # No credentials: the `shared` account. agent-feature overrides this
      # with the feature's own account.
      NATS_URL: nats://nats:4222
      # .git/config is read-only, so the identity comes from the environment.
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-dev}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-dev@localhost}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-dev}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-dev@localhost}
      CLAUDE_CONFIG_DIR: /home/dev/.claude
      HTTP_PROXY: http://proxy:3128
      HTTPS_PROXY: http://proxy:3128
      http_proxy: http://proxy:3128
      https_proxy: http://proxy:3128
      NO_PROXY: localhost,127.0.0.1,nats
      no_proxy: localhost,127.0.0.1,nats
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      nats:
        condition: service_healthy
      proxy:
        condition: service_healthy

  # The only service with internet access; filters by hostname.
  proxy:
    build: ./proxy
    restart: unless-stopped
    networks: [sandbox, egress]
    volumes:
      - ./allowed-domains.txt:/allowed-domains.txt:ro
    # TCP connect rather than HTTP, so it doesn't pollute the access log.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3128"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 5s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  nats:
    image: nats:2.15-alpine
    restart: unless-stopped
    networks: [sandbox]
    # One account per feature, see nats/nats-server.conf. The directory is
    # mounted (not the files) so regenerated accounts.conf is seen on reload.
    command: ["nats-server", "--config", "/etc/nats/nats-server.conf"]
    volumes:
      - ./nats:/etc/nats:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true'"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  # No gateway (v4 or v6) and no external DNS.
  sandbox:
    internal: true
  egress: {}

volumes:
  cargo-target:
  cargo-registry:
  agent-home:
  nats-data:
